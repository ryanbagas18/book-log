services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: booklog-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - booklog-net

    webserver:
        image: nginx:alpine
        container_name: booklog-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - booklog-net

    db:
        image: mysql:8.0
        container_name: booklog-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: book_log
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: booklog_user
            MYSQL_PASSWORD: booklog_password
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - booklog-net

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: booklog-phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
        networks:
            - booklog-net

networks:
    booklog-net:
        driver: bridge

volumes:
    dbdata:
